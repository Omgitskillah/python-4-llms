[package]
name = "python-4-llms"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "=1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "sync", "time", "signal"] }
tokio-util = "0.7"
ulid = "1.2"

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "python-mcp"
path = "src/main.rs"
